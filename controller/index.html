<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Box fleet controller</title>
  <style>
    :root{color-scheme:dark;--bg:#10191d;--panel:#17242a;--line:#33454c;--ink:#f4f1e8;--muted:#a9b8b8;--mint:#9ee5b5;--amber:#efc07f;--red:#ef9b92}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% -10%,#244037 0,transparent 32%),var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.45}button,a{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}a{text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:4px}main{max-width:1500px;margin:auto;padding:32px 42px}.masthead,.run-summary,.task-top,.task-foot,.repo-heading,.diagram-footer{display:flex;justify-content:space-between;align-items:center;gap:14px}.masthead{margin-bottom:16px}.brand,.eyebrow,.connection,.badge,.repo-count,#counts,.feed,time,.tabs button,.copy-note{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.brand{color:var(--mint);font-size:12px;letter-spacing:.16em;text-transform:uppercase}.connection{font-size:12px;color:var(--muted)}.connection.offline{color:var(--amber)}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:28px}h1{font-size:clamp(34px,5vw,65px);font-weight:400;letter-spacing:-.05em;margin:0}.tabs{display:flex;border:1px solid var(--line);padding:4px}.tabs button{border:0;background:transparent;color:var(--muted);font-size:13px;padding:9px 15px}.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}.assignment{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;border-top:1px solid var(--mint);border-bottom:1px solid var(--line);padding:20px 0;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}#prompt{white-space:pre-wrap;margin:0;max-height:180px;overflow:auto}.copy{background:var(--mint);color:#102219;border:0;padding:11px 16px;font-weight:700}.copy-note{font-size:11px;color:var(--muted);text-align:center;margin:7px 0 0}.run-summary{margin-bottom:17px}.run-message{display:flex;align-items:center;gap:12px}.run-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid #50715b;color:var(--mint);font-size:11px;padding:5px 8px;text-transform:uppercase}#counts{font-size:12px;color:var(--muted)}.repos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.repo{min-width:0}.repo-heading{margin-bottom:9px}.repo-name{font-size:18px;margin:0}.repo-count{font-size:11px;color:var(--muted)}.cards{display:grid;gap:9px}.task{background:linear-gradient(145deg,var(--panel),#142126);border:1px solid var(--line);padding:15px;min-height:130px}.task-top{margin-bottom:10px}.task-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}.badge{font-size:11px;display:flex;align-items:center;gap:6px}.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.badge.running{color:var(--amber)}.badge.ready{color:var(--mint)}.badge.failed,.badge.timed_out{color:var(--red)}.task h3{font-size:17px;font-weight:400;line-height:1.35;margin:0}.task-foot{margin-top:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}.activity{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result{color:var(--mint);font-weight:700;white-space:nowrap}.feed{border-top:1px solid var(--line);display:grid;grid-template-columns:120px 1fr;gap:18px;margin-top:25px;padding-top:16px}.feed h2{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:2px 0}.feed ol{list-style:none;margin:0;padding:0;max-height:110px;overflow:auto}.feed li{display:flex;gap:16px;font-size:13px;padding:3px 0}.feed time{font-size:11px;color:var(--muted)}.warning{color:var(--amber)}.empty{color:var(--muted)}.diagram-frame{border:1px solid var(--line);background:#faf9f5}.diagram-frame img{display:block;width:100%}.diagram-footer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:12px;margin-top:14px}.diagram-footer a{color:var(--mint)}[hidden]{display:none!important}@media(max-width:720px){main{padding:22px 16px}header,.run-summary,.diagram-footer{align-items:flex-start;flex-direction:column}.assignment{grid-template-columns:1fr}.assignment>div:last-child{justify-self:start}.feed{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <div class="masthead"><span class="brand">Local controller / Upstash Box</span><span id="connection" class="connection" role="status">Connecting…</span></div>
  <header><h1>One task, one sandbox.</h1><nav class="tabs" role="tablist" aria-label="Dashboard views"><button id="tasks-tab" role="tab" aria-selected="true" aria-controls="tasks-view">Tasks</button><button id="diagram-tab" role="tab" aria-selected="false" aria-controls="diagram-view">Flow</button></nav></header>
  <section id="tasks-view" role="tabpanel" aria-labelledby="tasks-tab">
    <div class="assignment"><div><p class="eyebrow">Portable run instructions</p><p id="prompt">Loading…</p></div><div><button id="copy" class="copy" disabled>Copy instructions</button><p class="copy-note">Review before adding --run</p></div></div>
    <div class="run-summary"><div class="run-message"><span id="phase" class="run-label">Waiting</span><span id="run-message">Waiting for local state.</span></div><span id="counts"></span></div>
    <div id="repos" class="repos"></div>
    <section class="feed" aria-label="Status summary"><h2>Status</h2><ol id="events"><li class="empty">No status checks yet.</li></ol></section>
  </section>
  <section id="diagram-view" role="tabpanel" aria-labelledby="diagram-tab" hidden><div class="diagram-frame"><img src="workflow.svg" alt="Task file goes through a local controller to separate cloud sandboxes. Each worker verifies and pushes a GitHub branch for human review and optional pull request creation."></div><div class="diagram-footer"><span>Branches wait for human review. Nothing merges automatically.</span><a href="workflow.excalidraw" download>Edit diagram ↗</a></div></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id);let latest=null;
const labels={queued:'Queued',running:'Working',ready:'Ready to review',failed:'Failed',timed_out:'Timed out',unknown:'Unknown'};
const phases={ready:'Ready',running:'In progress',complete:'Returned',attention:'Check run'};
const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};
function githubUrl(value){if(typeof value!=='string')return null;try{const u=new URL(value);return u.protocol==='https:'&&u.hostname==='github.com'&&!u.username&&!u.password&&!u.port?u.href:null}catch{return null}}
function link(value,label,cls){const href=githubUrl(value);if(!href)return null;const a=node('a',cls,label);a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a}
function render(state){latest=state;const tasks=Array.isArray(state.tasks)?state.tasks:[];const run=state.run||{};$('prompt').textContent=state.prompt||'No instructions received.';$('copy').disabled=!state.prompt;$('phase').textContent=phases[run.phase]||'Unknown';$('run-message').textContent=run.message||'';$('counts').textContent=`${tasks.length} task${tasks.length===1?'':'s'} · ${tasks.filter(t=>t.status==='ready').length} returned`;
 const groups=new Map();for(const task of tasks){if(!groups.has(task.repo))groups.set(task.repo,[]);groups.get(task.repo).push(task)}const repos=document.createDocumentFragment();for(const [repo,items] of groups){const section=node('section','repo'),head=node('div','repo-heading'),title=node('h2','repo-name');title.append(link('https://github.com/'+repo,repo,'')||document.createTextNode(repo));head.append(title,node('span','repo-count',items.length+' task'+(items.length===1?'':'s')));section.append(head);const cards=node('div','cards');for(const task of items){const status=Object.hasOwn(labels,task.status)?task.status:'unknown',card=node('article','task'),top=node('div','task-top');top.append(node('span','task-id',task.name||task.id),node('span','badge '+status,labels[status]));card.append(top,node('h3','',task.title||'Untitled task'));const foot=node('div','task-foot');foot.append(node('span','activity',task.last_activity||'No status'));const result=link(task.result_url,'Review branch ↗','result');if(result)foot.append(result);card.append(foot);cards.append(card)}section.append(cards);repos.append(section)}$('repos').replaceChildren(repos);
 const events=Array.isArray(state.events)?state.events.slice(-20).reverse():[],feed=document.createDocumentFragment();for(const event of events){const row=node('li',event.level==='warning'?'warning':'');const date=new Date(event.at),time=node('time','',Number.isNaN(date.getTime())?'':date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}));row.append(time,node('span','',event.message||''));feed.append(row)}if(!events.length)feed.append(node('li','empty','No remote status reads requested.'));$('events').replaceChildren(feed);$('connection').textContent='Local dashboard connected';$('connection').classList.remove('offline')}
async function poll(){try{const response=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(4500)});if(!response.ok)throw new Error();const state=await response.json();if(!state?.run||!Array.isArray(state.tasks))throw new Error();render(state)}catch{$('connection').textContent=latest?'Disconnected · showing last state':'Dashboard disconnected';$('connection').classList.add('offline')}finally{setTimeout(poll,2500)}}
$('copy').addEventListener('click',async()=>{if(!latest?.prompt)return;try{await navigator.clipboard.writeText(latest.prompt);$('copy').textContent='Copied'}catch{const range=document.createRange();range.selectNodeContents($('prompt'));getSelection().removeAllRanges();getSelection().addRange(range);$('copy').textContent='Select + copy'}setTimeout(()=>$('copy').textContent='Copy instructions',2200)});
for(const name of ['tasks','diagram']){$(name+'-tab').addEventListener('click',()=>{for(const other of ['tasks','diagram']){const selected=other===name;$(other+'-tab').setAttribute('aria-selected',String(selected));$(other+'-view').hidden=!selected}})}poll();
</script></body></html>
