<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">Portable Box agent workflow</title><desc id="desc">A local task file goes to a controller, which starts separate cloud sandboxes. Workers verify their work and push separate GitHub branches. A human reviews each branch and may open a pull request.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5b6b63" stroke-width="1.5"/></marker></defs><rect width="1600" height="700" fill="#faf9f5"/>
<g font-family="Georgia,serif"><text x="70" y="110" fill="#20342b" font-size="48">Parallel work, reviewable branches</text><text x="72" y="155" fill="#5b6b63" font-size="23">The controller coordinates. Workers verify and push. You decide what becomes a pull request.</text>
<g fill="#f0eee7" stroke="#20342b" stroke-width="2"><rect x="70" y="310" width="210" height="120" rx="10"/><rect x="345" y="310" width="220" height="120" rx="10"/><rect x="1030" y="310" width="220" height="120" rx="10"/></g><rect x="635" y="215" width="320" height="310" rx="12" fill="#e5f5ea" stroke="#087f5b" stroke-width="2"/><rect x="1320" y="310" width="210" height="120" rx="10" fill="#e5f5ea" stroke="#087f5b" stroke-width="2"/>
<g fill="#20342b" font-size="27" text-anchor="middle"><text x="175" y="360">Task file</text><text x="455" y="360">Local controller</text><text x="795" y="260" fill="#087f5b">Cloud sandboxes</text><text x="1140" y="360">GitHub branches</text><text x="1425" y="360">Human review</text></g><g fill="#5b6b63" font-size="20" text-anchor="middle"><text x="175" y="400">Prompts + checks</text><text x="455" y="400">Launch + monitor</text><text x="1140" y="400">One per task</text><text x="1425" y="400">Open PR if useful</text></g>
<g fill="#fff" stroke="#087f5b" stroke-width="2"><rect x="675" y="292" width="240" height="54" rx="8"/><rect x="675" y="365" width="240" height="54" rx="8"/><rect x="675" y="438" width="240" height="54" rx="8"/></g><g fill="#20342b" font-size="20" text-anchor="middle"><text x="795" y="326">Worker + repo copy</text><text x="795" y="399">Worker + repo copy</text><text x="795" y="472">Worker + repo copy</text></g>
<g fill="none" stroke="#5b6b63" stroke-width="2.5" marker-end="url(#a)"><path d="M290 370h44"/><path d="M575 370h49"/><path d="M965 370h54"/><path d="M1260 370h49"/></g><text x="795" y="575" fill="#087f5b" font-size="21" text-anchor="middle">Each worker runs its configured check before pushing</text><text x="1425" y="475" fill="#5b6b63" font-size="19" text-anchor="middle">Nothing merges automatically</text></g>
</svg>
